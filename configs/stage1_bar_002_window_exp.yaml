sample_id: bar_002
chart_type: bar
video_path: data/raw/videos/bar_sample2.mp4
processed_dir: data/processed/bar_002
generated_dir: data/generated/bar_002_window_exp
reviewed_dir: data/reviewed/bar_002_window_exp
review_db: data/review.db

model:
  env_var: MODEL_PATH
  prompt_version: qwen_data_video_candidate_v1
  batch_size: 1
  max_frames_per_call: 3
  dtype_preference: bf16
  allow_heuristic_fallback: false

video_standardization:
  fps: 30
  crf: 18
  video_codec: libx264
  pixel_format: yuv420p
  audio_codec: aac
  audio_rate: 48000
  wav_rate: 16000
  wav_channels: 1

sampling:
  coarse_fps: 2
  fine_fps: 8
  short_side: 768
  clip_expand_seconds: 0.75
  min_clip_seconds: 1.0

target_search:
  start_times_path: data/raw/start_time.jsonl
  before_seconds: 2
  after_seconds: 20
  extension_seconds: 10
  boundary_positive_gap_seconds: 1

detection:
  min_confidence: 0.5
  min_positive_frames: 2
  max_gap_seconds: 1.5
  clip_expand_seconds: 1.0
  fine_expand_seconds: 1.0
  min_clip_seconds: 1.0

keyframes:
  names:
    - initial
  min_completeness: 0.5
  purpose: seed frame for generating the full data-video clip from user intent

vtracer:
  color_precision: 6
  filter_speckle: 4
  mode: spline
  hierarchical: stacked
  path_precision: 8
